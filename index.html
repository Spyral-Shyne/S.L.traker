<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#071021" />
  <title>S.L.traker — Solo Leveling: Inicios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/lucide.min.js"></script>
  <style>
    :root{--bg:#071021;--neon:#00f0ff;--muted:#8ea4b8;--gold:#f8c857;--danger:#ff6b6b}
    html,body{min-height:100%;background:linear-gradient(180deg,#020817 0%,#071021 60%);color:#def9ff;font-family:Inter,system-ui,Arial}
    body{padding:24px}
    .glass{background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.05);backdrop-filter:blur(5px)}
    .neon-btn{background:linear-gradient(90deg,rgba(0,240,255,0.12),rgba(0,240,255,0.05));border:1px solid rgba(0,240,255,0.25);color:var(--neon);box-shadow:inset 0 0 8px rgba(0,240,255,0.08)}
    .neon-outline{border:1px solid rgba(0,240,255,0.22);color:var(--neon);background:rgba(0,240,255,0.02)}
    .badge{display:inline-flex;padding:0.2rem 0.55rem;border-radius:999px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03)}
    .progress{height:12px;background:rgba(255,255,255,0.06);border-radius:999px}
    .progress-bar{height:100%;background:linear-gradient(90deg,var(--neon),#62f3ff);transition:width .25s}
    .item-card{border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);border-radius:.75rem;padding:.8rem}
    .toast{background:rgba(5,10,18,0.92);border:1px solid rgba(0,240,255,0.08);color:#def9ff;padding:.6rem;border-radius:.5rem}
  </style>
</head>
<body>
  <div class="max-w-6xl mx-auto grid md:grid-cols-12 gap-6">
    <aside class="md:col-span-3 glass rounded-2xl p-5">
      <div class="flex items-center gap-4">
        <div style="width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#002 0,#0000 60%);display:grid;place-items:center;border:1px solid rgba(0,240,255,0.12)">
          <div class="text-center"><div class="text-xs text-slate-400">Lvl</div><div id="player-level" class="text-2xl font-bold">1</div></div>
        </div>
        <div>
          <div class="text-xs text-slate-400">Jugador</div>
          <div class="flex items-center gap-2"><h2 id="player-name" class="text-lg font-bold">Sung Jinwoo</h2><span id="player-title" class="badge">Cazador Rango E</span></div>
        </div>
      </div>

      <div class="mt-4">
        <div class="text-xs text-slate-400 flex justify-between"><span>XP</span><span id="xp-text">0 / 100</span></div>
        <div class="progress mt-2"><div id="xp-bar" class="progress-bar" style="width:0%"></div></div>
      </div>

      <div class="grid grid-cols-2 gap-3 mt-4 text-sm">
        <div class="item-card"><div class="text-slate-400">Oro</div><div id="player-gold" class="text-yellow-300 font-semibold">120</div></div>
        <div class="item-card"><div class="text-slate-400">Faltas</div><div id="player-missed" class="text-red-300 font-semibold">0</div></div>
      </div>

      <div class="mt-4 space-y-2">
        <button id="edit-btn" class="neon-btn w-full py-2 rounded-lg">Editar Nombre / Título</button>
        <button id="notif-btn" class="neon-outline w-full py-2 rounded-lg">[SISTEMA: ACTIVAR NOTIFICACIONES]</button>
        <div class="text-xs text-slate-400">Privado: notifs locales</div>
      </div>

      <div class="mt-4 item-card">
        <div class="text-xs text-slate-400">Clase</div>
        <select id="class-select" class="w-full mt-2 bg-transparent border border-slate-700 p-2 rounded">
          <option value="hunter">Cazador</option>
          <option value="scout">Explorador</option>
          <option value="guardian">Guardián</option>
          <option value="mage">Mago</option>
        </select>
      </div>
    </aside>

    <main class="md:col-span-6 space-y-6">
      <section class="glass rounded-2xl p-5">
        <div class="flex justify-between items-center mb-3"><h3 class="text-lg font-bold">Misiones (Quests)</h3><span class="badge">Serie I — Inicios</span></div>
        <div id="missions" class="space-y-3"></div>
      </section>

      <section class="glass rounded-2xl p-5">
        <div class="flex justify-between items-center mb-3"><h3 class="text-lg font-bold">Contratos (Riesgo / Recompensa)</h3><span class="badge">Opcional</span></div>
        <div id="contracts" class="space-y-3"></div>
      </section>

      <section class="glass rounded-2xl p-5">
        <div class="flex justify-between items-center mb-3"><h3 class="text-lg font-bold">Tienda</h3><span class="badge">Mejora tu viaje</span></div>
        <div id="shop" class="space-y-3"></div>
      </section>
    </main>

    <aside class="md:col-span-3 space-y-6">
      <section class="glass rounded-2xl p-5">
        <div class="flex justify-between items-center mb-3"><h3 class="text-lg font-bold">Logros</h3><span id="ach-count" class="badge">0/0</span></div>
        <div id="achievements" class="space-y-2"></div>
      </section>

      <section class="glass rounded-2xl p-5">
        <div class="flex justify-between items-center mb-3"><h3 class="text-lg font-bold">Registro</h3><span class="badge">Últimas</span></div>
        <div id="log" class="scroll-panel space-y-2"></div>
      </section>
    </aside>
  </div>

  <!-- Edit modal -->
  <div id="modal-edit" class="fixed inset-0 hidden items-center justify-center z-50"><div class="absolute inset-0" style="background:rgba(0,0,0,0.6)"></div>
    <div class="relative z-10 w-full max-w-md p-5 rounded bg-[#081421] glass">
      <div class="flex justify-between items-center mb-3"><h4 class="font-bold">Editar Jugador</h4><button id="close-edit" class="text-slate-400"><span data-lucide="x"></span></button></div>
      <div class="space-y-3"><input id="name-input" class="w-full p-2 bg-transparent border rounded" placeholder="Nombre"/><input id="title-input" class="w-full p-2 bg-transparent border rounded" placeholder="Título"/><div class="flex justify-end gap-2"><button id="cancel-edit" class="neon-outline px-3 py-1 rounded">Cancelar</button><button id="save-edit" class="neon-btn px-3 py-1 rounded">Guardar</button></div></div>
    </div>
  </div>

  <div id="toast-area" class="fixed bottom-6 right-6 space-y-2 z-50"></div>

  <script>
    const STORAGE_KEY = 'solo_leveling_state';

    const defaultState = {
      player:{name:'Sung Jinwoo',title:'Cazador Rango E',level:1,xp:0,gold:120,missed:0,class:'hunter'},
      missions:[
        { id:'m1',title:'Entrenamiento básico',desc:'30 min de cardio ligero',xp:30,gold:10,completed:false,available:true,risk:0 },
        { id:'m2',title:'Prueba de fuerza',desc:'3 series de levantamiento',xp:60,gold:30,completed:false,available:true,risk:10 },
        { id:'m3',title:'Desafío vigor',desc:'HIIT 20 min (riesgoso)',xp:110,gold:60,completed:false,available:true,risk:25 }
      ],
      contracts:[
        { id:'c1',title:'Contrato menor',desc:'+50% XP si completas, pierdes 15 oro si fallas', rewardXp:0.5,rewardGold:0,riskGold:15,accepted:false },
        { id:'c2',title:'Contrato arriesgado',desc:'+120% XP y +30 oro, fallar quita 40 XP', rewardXp:1.2,rewardGold:30,riskXp:40,accepted:false }
      ],
      shop:[{id:'s1',name:'Poción de XP',desc:'+50 XP inmediato',cost:80,apply:{xp:50}},{id:'s2',name:'Ticket de caja',desc:'Abre una caja de botín',cost:40,apply:{loot:true}}],
      achievements:[{id:'a1',title:'Primer paso',desc:'Completa tu primera misión',done:false},{id:'a2',title:'Riesgo calculado',desc:'Completa un contrato arriesgado',done:false}],
      logs:[]
    };

    function load(){ try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) { const parsed = JSON.parse(raw); return {...defaultState,...parsed}; } }catch(e){console.warn('load',e);} return JSON.parse(JSON.stringify(defaultState)); }
    let state = load();
    function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    function showToast(title,txt,ms=3000){ const area=document.getElementById('toast-area'); const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<div class="font-semibold">${title}</div><div class="text-xs text-slate-300">${txt}</div>`; area.appendChild(t); setTimeout(()=>t.remove(),ms); }
    function pushLog(text){ state.logs.unshift({text,time:Date.now()}); if(state.logs.length>30) state.logs.pop(); save(); renderLogs(); }

    function renderPlayer(){ document.getElementById('player-name').textContent=state.player.name; document.getElementById('player-title').textContent=state.player.title; document.getElementById('player-level').textContent=state.player.level; document.getElementById('player-gold').textContent=state.player.gold; document.getElementById('player-missed').textContent=state.player.missed; const req = xpReq(state.player.level); document.getElementById('xp-text').textContent=`${state.player.xp} / ${req}`; document.getElementById('xp-bar').style.width=Math.min(100,(state.player.xp/req)*100)+'%'; document.getElementById('class-select').value=state.player.class; }

    function xpReq(l){ return Math.floor(100 * Math.pow(1.25, Math.max(0,l-1))); }

    function renderMissions(){ const el=document.getElementById('missions'); el.innerHTML = state.missions.map(m=>`<div class="item-card"><div class="flex justify-between"><div><div class="font-semibold">${m.title}</div><div class="text-xs text-slate-400">${m.desc}</div></div><div class="text-right"><div class="text-cyan-200">+${m.xp} XP</div><div class="text-yellow-300">+${m.gold} Oro</div><div class="text-xs text-slate-400">Riesgo ${m.risk}%</div></div></div><div class="mt-3 flex gap-2"><button data-id="${m.id}" class="do-mission neon-btn px-3 py-1 rounded">Realizar</button><button data-id="${m.id}" class="skip-mission neon-outline px-3 py-1 rounded">Saltar</button></div></div>`).join(''); document.querySelectorAll('.do-mission').forEach(b=>b.addEventListener('click',e=>attemptMission(e.target.dataset.id))); document.querySelectorAll('.skip-mission').forEach(b=>b.addEventListener('click',e=>skipMission(e.target.dataset.id))); }

    function attemptMission(id){ const m=state.missions.find(x=>x.id===id); if(!m) return; // risk check
      const roll = Math.random()*100; const effectiveRisk = m.risk; const success = roll >= effectiveRisk; if(success){ // success
        state.player.xp += m.xp; state.player.gold += m.gold; m.completed = true; pushLog(`[Misión] ${m.title} completada. +${m.xp} XP, +${m.gold} Oro.`); showToast('Misión cumplida', m.title); checkLevelUp(); applyContractsOnSuccess(m); } else { // fail
        // apply penalties if any contract accepted
        pushLog(`[Misión] ${m.title} fallida.`); showToast('Misión fallida', `Fallaste la misión: ${m.title}`,3000); state.player.missed++; // small penalty
        state.player.gold = Math.max(0,state.player.gold - Math.floor(m.gold/2)); }
      save(); renderAll(); checkAchievements(); }

    function skipMission(id){ const m=state.missions.find(x=>x.id===id); if(!m) return; // skip considered as miss with less penalty
      state.player.missed++; state.player.gold = Math.max(0,state.player.gold - Math.floor((m.gold||10)/3)); pushLog(`[Misión] ${m.title} saltada.`); save(); renderAll(); }

    function checkLevelUp(){ let req = xpReq(state.player.level); while(state.player.xp >= req){ state.player.xp -= req; state.player.level++; pushLog(`[Nivel] ¡Has subido al nivel ${state.player.level}!`); showToast('LEVEL UP', `Nivel ${state.player.level}`); applyLevelRewards(); req = xpReq(state.player.level); } }
    function applyLevelRewards(){ // example: give points or gold
      state.player.gold += 20; pushLog('[Sistema] Recompensa de nivel: +20 Oro'); }

    function renderContracts(){ const el=document.getElementById('contracts'); el.innerHTML=state.contracts.map(c=>`<div class="item-card ${c.accepted? '' : ''}"><div class="flex justify-between"><div><div class="font-semibold">${c.title}</div><div class="text-xs text-slate-400">${c.desc}</div></div><div><button data-id="${c.id}" class="toggle-contract neon-btn px-3 py-1 rounded">${c.accepted? 'Cancelar':'Aceptar'}</button></div></div></div>`).join(''); document.querySelectorAll('.toggle-contract').forEach(b=>b.addEventListener('click',e=>toggleContract(e.target.dataset.id))); }

    function toggleContract(id){ const c=state.contracts.find(x=>x.id===id); if(!c) return; c.accepted = !c.accepted; pushLog(`[Contrato] ${c.title} ${c.accepted? 'aceptado' : 'cancelado'}`); save(); renderContracts(); }

    function applyContractsOnSuccess(mission){ // if any accepted contract modifies rewards
      state.contracts.forEach(c=>{ if(c.accepted){ // apply reward multipliers or extras
          if(c.rewardXp) { const add = Math.floor(mission.xp * (c.rewardXp)); state.player.xp += add; pushLog(`[Contrato] Bonus: +${add} XP por ${c.title}`); }
          if(c.rewardGold) { state.player.gold += c.rewardGold; pushLog(`[Contrato] Bonus: +${c.rewardGold} Oro por ${c.title}`); }
        } }); }

    function applyContractsOnFail(mission){ state.contracts.forEach(c=>{ if(c.accepted){ if(c.riskGold) { state.player.gold = Math.max(0, state.player.gold - c.riskGold); pushLog(`[Contrato] Penalización: -${c.riskGold} Oro por fallo en ${c.title}`); } if(c.riskXp) { state.player.xp = Math.max(0, state.player.xp - c.riskXp); pushLog(`[Contrato] Penalización: -${c.riskXp} XP por fallo en ${c.title}`); } } }); }

    function renderShop(){ const el=document.getElementById('shop'); el.innerHTML = state.shop.map(s=>`<div class="item-card"><div class="flex justify-between"><div><div class="font-semibold">${s.name}</div><div class="text-xs text-slate-400">${s.desc}</div></div><div class="text-right"><div class="text-gold font-semibold">${s.cost} Oro</div><button data-id="${s.id}" class="buy-neon neon-btn mt-2 px-3 py-1 rounded">Comprar</button></div></div></div>`).join(''); document.querySelectorAll('.buy-neon').forEach(b=>b.addEventListener('click',e=>buyItem(e.target.dataset.id))); }

    function buyItem(id){ const it = state.shop.find(x=>x.id===id); if(!it) return; if(state.player.gold < it.cost){ showToast('Fondos insuficientes','No tienes suficiente oro'); return; } state.player.gold -= it.cost; if(it.apply && it.apply.xp) state.player.xp += it.apply.xp; if(it.apply && it.apply.loot) { // simulate adding random loot
        const loot = 'Botín ' + Math.floor(Math.random()*1000); pushLog(`[Tienda] Recibiste ${loot}`); }
      pushLog(`[Tienda] Comprado: ${it.name}`); save(); renderAll(); }

    function renderAchievements(){ document.getElementById('ach-count').textContent = `${state.achievements.filter(a=>a.done).length}/${state.achievements.length}`; const el=document.getElementById('achievements'); el.innerHTML = state.achievements.map(a=>`<div class="item-card ${a.done? '': ''}"><div class="flex justify-between"><div><div class="font-medium">${a.title}</div><div class="text-xs text-slate-400">${a.desc}</div></div><div class="badge">${a.done? 'Unlocked' : 'Locked'}</div></div></div>`).join(''); }

    function checkAchievements(){ if(!state.achievements.find(a=>a.id==='a1').done && state.missions.some(m=>m.completed)) { state.achievements.find(a=>a.id==='a1').done=true; pushLog('[Logro] Primer paso desbloqueado'); sendPrivateNotification('Logro desbloqueado','Primer paso'); } if(!state.achievements.find(a=>a.id==='a2').done){ if(state.contracts.find(c=>c.accepted && c.rewardXp>1)) { // accepted risky
        state.achievements.find(a=>a.id==='a2').done=true; pushLog('[Logro] Riesgo calculado desbloqueado'); sendPrivateNotification('Logro','Riesgo calculado'); } } save(); renderAchievements(); }

    function sendPrivateNotification(title,body){ // respects permission; private means local notifications only
      if('Notification' in window && Notification.permission==='granted'){ try{ new Notification(title,{body,tag:'sl-private'}); }catch(e){ showToast(title,body); } } else { showToast(title,body); } }

    // logs
    function renderLogs(){ const el=document.getElementById('log'); if(!state.logs.length){ el.innerHTML='<div class="text-sm text-slate-400">Sin actividad</div>'; return; } el.innerHTML = state.logs.slice(0,12).map(l=>`<div class="item-card"><div class="text-xs text-slate-400">${new Date(l.time).toLocaleString()}</div><div class="mt-1">${l.text}</div></div>`).join(''); }

    // UI & events
    document.getElementById('edit-btn').addEventListener('click',()=>{ document.getElementById('name-input').value=state.player.name; document.getElementById('title-input').value=state.player.title; document.getElementById('modal-edit').classList.remove('hidden'); });
    document.getElementById('close-edit').addEventListener('click',()=>document.getElementById('modal-edit').classList.add('hidden'));
    document.getElementById('cancel-edit').addEventListener('click',()=>document.getElementById('modal-edit').classList.add('hidden'));
    document.getElementById('save-edit').addEventListener('click',()=>{ const n=document.getElementById('name-input').value.trim()||'Anónimo'; const t=document.getElementById('title-input').value.trim()||'Cazador'; state.player.name=n; state.player.title=t; save(); renderPlayer(); pushLog(`[Perfil] ${n} - ${t}`); document.getElementById('modal-edit').classList.add('hidden'); showToast('Guardado','Perfil actualizado'); });

    document.getElementById('class-select').addEventListener('change',(e)=>{ state.player.class=e.target.value; save(); renderPlayer(); pushLog('[Clase] Clase cambiada'); });
    document.getElementById('notif-btn').addEventListener('click',async ()=>{ if(!('Notification' in window)){ showToast('No soportado','Tu navegador no soporta notificaciones'); return; } const r = await Notification.requestPermission(); if(r==='granted') showToast('Notificaciones','Activadas'); else showToast('Notificaciones','No concedidas'); });

    // initial render
    function renderAll(){ renderPlayer(); renderMissions(); renderContracts(); renderShop(); renderAchievements(); renderLogs(); }
    renderAll();

  </script>
</body>
</html>
