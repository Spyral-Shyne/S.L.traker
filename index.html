<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#00f0ff" />
  <title>S.L.traker — System Panel</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="S.L. System" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5968/5968282.png" />

  <!-- Tailwind CDN & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/lucide.min.js"></script>

  <style>
    :root {
      --bg: #071021;
      --panel: rgba(9, 17, 29, 0.85);
      --muted: #8ea4b8;
      --neon: #00f0ff;
      --gold: #f8c857;
      --danger: #ff4d6d;
      --green: #4ade80;
      --purple: #c084fc;
    }

    html, body {
      min-height: 100%;
      background: radial-gradient(circle at top, rgba(0, 240, 255, 0.08), transparent 45%), linear-gradient(180deg, #020817 0%, #071021 65%);
      color: #eafcff;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }

    body { padding: 18px; }

    .glass {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
      border: 1px solid rgba(0, 240, 255, 0.12);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 16px rgba(0, 240, 255, 0.05);
      backdrop-filter: blur(8px);
    }

    .panel-title {
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 700;
    }

    .neon-btn {
      background: linear-gradient(90deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.04));
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--neon);
      box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.1), 0 0 12px rgba(0, 240, 255, 0.15);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
      transition: all 0.15s ease;
    }
    .neon-btn:hover { transform: translateY(-1px); box-shadow: inset 0 0 12px rgba(0, 240, 255, 0.2), 0 0 20px rgba(0, 240, 255, 0.3); }

    .neon-danger {
      background: linear-gradient(90deg, rgba(255, 77, 109, 0.18), rgba(255, 77, 109, 0.05));
      border: 1px solid rgba(255, 77, 109, 0.4);
      color: var(--danger);
      box-shadow: inset 0 0 8px rgba(255, 77, 109, 0.15), 0 0 12px rgba(255, 77, 109, 0.2);
    }

    .neon-outline { border: 1px solid rgba(0, 240, 255, 0.22); color: var(--neon); background: rgba(0, 240, 255, 0.02); }
    
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0.2rem 0.55rem;
      font-size: 0.68rem;
      border: 1px solid rgba(0, 240, 255, 0.2);
      background: rgba(0, 240, 255, 0.05);
      color: var(--neon);
    }

    .item-card {
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 0.75rem;
      padding: 0.8rem;
    }

    .progress {
      height: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
      border-radius: 999px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--neon), #62f3ff 70%, #ffffff);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      border-radius: inherit;
      transition: width 0.3s ease;
    }

    .toast {
      background: rgba(5, 10, 18, 0.95);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: #def9ff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), 0 0 15px rgba(0, 240, 255, 0.15);
    }

    .modal-backdrop { background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); }

    .pulse-danger { animation: dangerPulse 1.8s infinite; }
    @keyframes dangerPulse {
      0%, 100% { box-shadow: 0 0 5px rgba(255,77,109,0.2); }
      50% { box-shadow: 0 0 22px rgba(255,77,109,0.5); }
    }
  </style>
</head>
<body>
  <div class="max-w-7xl mx-auto grid md:grid-cols-12 gap-6">

    <!-- PANEL LATERAL IZQUIERDO: PERFIL, STATS Y RANGO -->
    <aside class="md:col-span-4 lg:col-span-3 glass rounded-2xl p-5 space-y-5">
      
      <!-- Cabecera Perfil con Botón Discreto de Ajustes y Avatar Personalizable -->
      <div class="relative flex items-center gap-4 pt-1">
        <!-- Botón Discreto de Edición (Engranaje) -->
        <button id="edit-player-btn" title="Editar Perfil" class="absolute top-0 right-0 p-1.5 text-slate-500 hover:text-cyan-300 transition-colors rounded-lg bg-slate-900/40 border border-slate-800">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>

        <!-- Avatar con Imagen o Nivel por defecto -->
        <div id="player-avatar-container" class="w-20 h-20 rounded-full flex items-center justify-center bg-gradient-to-br from-[#002b36] to-[#001018] border border-cyan-400/30 shadow-[0_0_15px_rgba(0,240,255,0.15)] flex-shrink-0 overflow-hidden relative group cursor-pointer" title="Haz clic para cambiar foto">
          <!-- Se inserta imagen o fallback por JS -->
        </div>

        <div class="min-w-0 pr-6">
          <div class="panel-title">Jugador</div>
          <h2 id="player-name" class="text-xl font-bold truncate text-white">Sung Jinwoo</h2>
          <div class="mt-1 flex items-center gap-1.5 flex-wrap">
            <span id="player-title" class="badge">Cazador</span>
            <span id="player-rank-badge" class="badge font-bold text-cyan-300">Rango E</span>
          </div>
        </div>
      </div>

      <!-- Racha Diaria de Desafíos -->
      <div class="item-card bg-cyan-950/20 border-cyan-500/20 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="flame" class="w-5 h-5 text-amber-400"></i>
          <div>
            <div class="text-[10px] uppercase text-slate-400 font-bold">Racha Diaria</div>
            <div id="streak-text" class="text-xs font-bold text-cyan-200">0 Días Consecutivos</div>
          </div>
        </div>
        <span id="streak-badge" class="badge text-[10px]">Meta: 5 Días</span>
      </div>

      <!-- Barra de XP / Oro / Bajas -->
      <div class="space-y-3">
        <div class="item
